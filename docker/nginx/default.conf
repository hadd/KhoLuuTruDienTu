server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # pdfjs worker (.mjs) must be served as JavaScript, not application/octet-stream
  types {
    application/javascript mjs;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}




