services:
  db:
    image: postgres:15
    container_name: sohoa-postgres-local
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: sohoa
    ports:
      - "54325:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio
    container_name: sohoa-minio-local
    restart: always
    ports:
      - "9000:9000"    # Port cho API (S3)
      - "9001:9001"    # Port cho Giao diện quản lý (Console)
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: Admin@123
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"

volumes:
  postgres_data:
  minio_data: