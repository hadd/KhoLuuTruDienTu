services:
  server:
    build:
      context: ../../
      dockerfile: packages/sohoa-backend/Dockerfile
    container_name: sohoa-server
    restart: always
    ports:
      - "8000:8000"
    # Elasticsearch chạy instance riêng (docker-compose.elasticsearch.yml).
    # Backend kết nối qua host IP đã publish port 9200 — giống Postgres/S3/Kafka.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - NODE_ENV=development
      - HOST=0.0.0.0
      - PORT=8000
      - CORS_ORIGINS=http://10.10.6.134:3000,http://localhost:3000
      - FRONTEND_URL=http://10.10.6.134:3000
      - DB_SCHEMA=sohoa_app
      - DATABASE_URL=postgresql://postgres:postgres@10.10.6.134:54322/sohoa
      - S3={"endPoint":"10.10.6.134","port":9000,"useSSL":false,"accessKey":"admin","secretKey":"Admin@123","bucket":"data-lake","region":"","maxFileSize":419430400}
      - INTERNAL_API_KEY=e8ed1632f573344130e441d1ef9bacf6
      - HTTP_LOGS=false
      - DB_QUERY_LOGS=false
      - KAFKA_ENABLED=false
      - KAFKA_BROKER=10.10.6.134:9092
      - KAFKA_GROUP_ID=sohoa-backend-group
      - KAFKA_METADATA_TOPIC=metadata-completed
      - KAFKA_MERGE_FINISHED_WAIT_TOPIC=merge-finished-wait
      - KAFKA_MERGE_COMPLETED_TOPIC=merge-completed
      - KAFKA_START_METADATA_TT05_TOPIC=start-metadata-tt05
      - KAFKA_TT05_METADATA_TOPIC=tt05-metadata-completed
      - SCANNER_ENABLED=true
      - SCANNER_INTERVAL_MS=10000
      - ELASTICSEARCH_ENABLED=true
      - ELASTICSEARCH_URL=http://10.10.6.134:2005
      # SMTP infra (required when using email channel in notification config)
      - SMTP_HOST=smtp.gmail.com
      - SMTP_PORT=587
      - SMTP_SECURE=false
      # Sender identity: configure via Admin UI
      # PUT /api/v1/admin/notification-configs/email-sender
